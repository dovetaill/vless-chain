name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: ${{ matrix.system }} ${{ matrix.arch }}
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            system: linux
          - runner: ubuntu-22.04-arm
            arch: aarch64
            system: linux
          - runner: macos-14
            arch: aarch64
            system: darwin
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 -B scripts/ci_release.py validate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install WebAuthn build dependencies
        run: |
          if [ "${{ matrix.system }}" = linux ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev musl-tools perl
            rustup target add "${{ matrix.arch }}-unknown-linux-musl"
          fi
      - name: Cache build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/chain-build-cache
          key: build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-${{ hashFiles('panel/Cargo.lock', 'panel/frontend/package-lock.json', 'scripts/chain_release.py') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-${{ hashFiles('panel/Cargo.lock', 'panel/frontend/package-lock.json', 'scripts/chain_release.py') }}-
            build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-
      - name: Check installer
        run: python3 -B scripts/ci_release.py check
      - name: Verify failed OpenRC installation can be retried
        if: github.ref_type == 'tag' && matrix.system == 'linux' && matrix.arch == 'x86_64'
        run: |
          trap 'docker rm -f chain-openrc-recovery >/dev/null 2>&1 || true' EXIT
          docker run --rm --init --name chain-openrc-recovery \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --workdir /source --env PYTHONDONTWRITEBYTECODE=1 --env CHAIN_TEST_OPENRC=1 \
            alpine:3.23.6@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0 \
            sh -ec 'apk add --no-cache openrc python3; python3 -B scripts/tests/openrc_recovery.py'
      - name: Build native release
        env:
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
          CHAIN_BUILD_CACHE: '1'
        run: |
          ./scripts/version-release.sh build --work-parent "$RUNNER_TEMP" --output "$RUNNER_TEMP/release-$RELEASE_PLATFORM"
      - name: Verify installed panel and local Agent
        if: github.ref_type == 'tag'
        env:
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
        run: |
          python3 -B scripts/ci_release.py smoke --input "$RUNNER_TEMP/release-$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-${{ matrix.system }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-${{ matrix.system }}-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove task artifacts
        if: always()
        env:
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
        run: rm -rf -- "$RUNNER_TEMP/release-$RELEASE_PLATFORM"

  publish:
    name: Verify and publish complete release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/chain-artifacts
      - name: Validate all platform builds and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/ci_release.py assemble --input "$RUNNER_TEMP/chain-artifacts" --output "$RUNNER_TEMP/chain-release"
          python3 -B scripts/ci_release.py publish --input "$RUNNER_TEMP/chain-release"
      - name: Remove task artifacts
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chain-artifacts" "$RUNNER_TEMP/chain-release"

  cleanup:
    name: Remove intermediate workflow artifacts
    if: always() && github.ref_type == 'tag'
    needs: [build, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this run's uploaded build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r artifact; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"; done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')" = 0
