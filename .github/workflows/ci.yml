name: CI

on:
  push:
    branches: [main]
    paths: ['panel/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['panel/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: ${{ matrix.system }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            system: linux
          - runner: ubuntu-22.04-arm
            arch: aarch64
            system: linux
          - runner: macos-14
            arch: aarch64
            system: darwin
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install WebAuthn build dependencies
        run: |
          if [ "${{ matrix.system }}" = linux ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev musl-tools perl
            rustup target add "${{ matrix.arch }}-unknown-linux-musl"
          fi
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/chain-build-cache
          key: build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-${{ hashFiles('panel/Cargo.lock', 'panel/frontend/package-lock.json', 'scripts/chain_release.py') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-${{ hashFiles('panel/Cargo.lock', 'panel/frontend/package-lock.json', 'scripts/chain_release.py') }}-
            build-v1-${{ matrix.runner }}-${{ matrix.arch }}-rust1.96.0-node22.23.3-
      - name: Check installer
        run: python3 -B scripts/ci_release.py check
      - name: Test and build native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
          CHAIN_BUILD_CACHE: '1'
        run: |
          ./scripts/version-release.sh build --work-parent "$RUNNER_TEMP" --output "$RUNNER_TEMP/release-$RELEASE_PLATFORM"
      - name: Verify native installation and release smoke tests
        env:
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
        run: python3 -B scripts/ci_release.py smoke --input "$RUNNER_TEMP/release-$RELEASE_PLATFORM"
      - name: Remove task artifacts
        if: always()
        env:
          RELEASE_PLATFORM: ${{ matrix.system }}-${{ matrix.arch }}
        run: rm -rf -- "$RUNNER_TEMP/release-$RELEASE_PLATFORM"
      - name: Save main branch build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/chain-build-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
